name: windows-x64

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ linux-x64 ]
    types:
      - completed

permissions:
  contents: write

jobs:
  windows-x64-yosys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache sources
        uses: actions/cache/restore@v5
        with:
          key: cache-sources-yosys
          path: _sources
      - name: Download previous build
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/bucket-windows-x64/windows-x64-yosys.tgz"
          if wget --spider "${URL}" 2>/dev/null; then
              wget -qO- "${URL}" --retry-connrefused --read-timeout=20 --timeout=15 --retry-on-http-error=404 | tar xvfz -
          else
              echo "Previous version not found in bucket"
          fi
      - name: Download linux-x64-abc
        run: wget -qO- "https://github.com/${{ github.repository }}/releases/download/bucket-linux-x64/linux-x64-abc.tgz" --retry-connrefused --read-timeout=20 --timeout=15 --retry-on-http-error=404 | tar xvfz -
      - name: Build
        run: ./builder.py build --arch=windows-x64 --target=yosys --rules=default --single --tar
      - uses: ncipollo/release-action@v1
        if: hashFiles('windows-x64-yosys.tgz') != ''
        with:
          allowUpdates: True
          prerelease: True
          omitBody: True
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          tag: bucket-windows-x64
          artifacts: "windows-x64-yosys.tgz"
          token: ${{ secrets.GITHUB_TOKEN }}

