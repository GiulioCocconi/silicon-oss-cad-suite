name: linux-x64
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64-abc:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Cache sources
        uses: actions/cache@v5
        with:
          key: cache-sources-abc
          path: _sources
      - name: Download previous build
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/bucket-linux-x64/linux-x64-abc.tgz"
          if wget --spider "${URL}" 2>/dev/null; then
              wget -qO- "${URL}" --retry-connrefused --read-timeout=20 --timeout=15 --retry-on-http-error=404 | tar xvfz -
          else
              echo "Previous version not found in bucket"
          fi
      - name: Build
        run: ./builder.py build --arch=linux-x64 --target=abc --rules=default --single --tar
      - uses: ncipollo/release-action@v1
        if: hashFiles('linux-x64-abc.tgz') != ''
        with:
          allowUpdates: True
          prerelease: True
          omitBody: True
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          tag: bucket-linux-x64
          artifacts: "linux-x64-abc.tgz"
          token: ${{ secrets.GITHUB_TOKEN }}

